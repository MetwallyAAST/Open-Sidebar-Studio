services:
  postgres:
    image: postgres:17-alpine
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: sidebar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sidebar_builder
    volumes: ["sidebar_database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidebar -d sidebar_builder"]
      interval: 3s
      retries: 20
volumes:
  sidebar_database:
